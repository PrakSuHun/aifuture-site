# =====================================================
#  Sveltia CMS / Decap CMS 콘텐츠 스키마
#  ── 한국AI미래연구회 사이트 콘텐츠 관리 설정
# =====================================================

# GitHub 백엔드 (Sveltia CMS 사용 시 OAuth 프록시 불필요)
backend:
  name: github
  repo: USER/REPO            # ⚠️ 본인 GitHub 사용자명/저장소명으로 변경 (예: leejaewoong/aifuture-site)
  branch: main               # 또는 master / 사용 중인 기본 브랜치명
  # commit_messages 는 선택 사항 — 커밋 메시지 형식 커스터마이징
  commit_messages:
    create: '내용 추가: {{collection}} 「{{slug}}」'
    update: '내용 수정: {{collection}} 「{{slug}}」'
    delete: '내용 삭제: {{collection}} 「{{slug}}」'
    uploadMedia: '이미지 업로드: {{path}}'
    deleteMedia: '이미지 삭제: {{path}}'

# 로컬 개발용 (npx @sveltia/cms-proxy-server 또는 npx decap-server 띄울 때)
local_backend: true

# 미디어(이미지) 저장 위치
# 저장소 안의 한국AI미래연구회/uploads/ 폴더에 업로드됨
media_folder: 'uploads'
public_folder: '/uploads'

# 미디어 라이브러리 옵션 — 큰 이미지는 자동 리사이즈
media_library:
  config:
    multiple: false

# CMS 표시 언어 (Sveltia 한국어 지원)
locale: 'ko'

# 콘텐츠 스키마
collections:
  - name: site
    label: '사이트 콘텐츠'
    label_singular: '콘텐츠'
    description: '사이트 전체에 표시되는 텍스트와 이미지를 관리합니다. 저장하면 GitHub에 자동 커밋되고, Vercel이 사이트를 다시 빌드합니다 (보통 1~2분).'
    files:
      - name: content
        label: '전체 콘텐츠 (content.json)'
        file: '한국AI미래연구회/content.json'
        format: 'json'
        fields:
          # ── 네비게이션 ──
          - label: '🧭 네비게이션 / 로고'
            name: nav
            widget: object
            collapsed: true
            fields:
              - { label: '상단 로고 이미지', name: logo, widget: image, required: false }
              - { label: '메뉴 — Home', name: home, widget: string }
              - { label: '메뉴 — About', name: about, widget: string }
              - { label: '메뉴 — Scope', name: scope, widget: string }
              - { label: '메뉴 — Curriculum', name: curriculum, widget: string }
